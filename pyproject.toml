[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headscale-integration"
version = "0.1.0"
description = "Headscale API integration and deployment tooling for Swarmchestrate"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cluster_builder*"]
